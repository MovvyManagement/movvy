# Stripe calls this with no Supabase JWT — the Stripe-Signature check IS the auth.
[functions.stripe-webhook]
verify_jwt = false
# These are invoked by DB triggers / pg_cron with a shared-secret header (not a
# user JWT), so the gateway must let them through; each verifies its own secret.
[functions.notifications-push]
verify_jwt = false
[functions.customer-welcome-on-signup]
verify_jwt = false
[functions.partner-welcome-on-signup]
verify_jwt = false
[functions.cron-weekly-payouts]
verify_jwt = false
# External webhooks — the sender can't attach a Supabase JWT; each function
# authenticates its caller itself (Twilio X-Twilio-Signature, Resend/svix
# signature, or a shared secret) and fails closed if its secret is unset.
[functions.twilio-voice-webhook]
verify_jwt = false
[functions.resend-webhook]
verify_jwt = false
[functions.send-test-emails]
verify_jwt = false
[functions.smoke-test]
verify_jwt = false
[functions.smoke-probe]
verify_jwt = false
# Called with a Supabase JWT (anon pre-signup, signed-in user, or — for
# support-ai-reply — the service-role bearer that chat-send attaches).
[functions.support-ai-reply]
verify_jwt = true
