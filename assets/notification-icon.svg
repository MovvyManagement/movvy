<!-- Android status-bar icon. Android masks this to its alpha channel and tints
     it, so it MUST be a white-on-transparent silhouette — any colour here is
     discarded and any opaque background becomes a solid white blob. -->
<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" width="96" height="96">
  <g fill="#FFFFFF">
    <!-- Cargo body -->
    <rect x="14" y="34" width="38" height="28" rx="3"/>
    <!-- Cab -->
    <path d="M 54,40 L 68,40 Q 74,40 76,47 L 77,62 L 54,62 Z"/>
    <!-- Chassis -->
    <rect x="14" y="62" width="63" height="3.5" rx="1.75"/>
    <!-- Wheels -->
    <circle cx="27" cy="70" r="6"/>
    <circle cx="65" cy="70" r="6"/>
    <!-- Destination pin -->
    <path d="M 70,10 C 65,10 61,14 61,19 C 61,25 70,31 70,31 C 70,31 79,25 79,19 C 79,14 75,10 70,10 Z"/>
  </g>
</svg>
